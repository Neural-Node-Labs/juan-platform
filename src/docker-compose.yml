services:
  juan:
    build: .
    container_name: juan-agent
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - juan-data:/data
      - ./config:/config:ro
      - ./plugins:/app/plugins
    env_file:
      - .env
    environment:
      JUAN_DB_PATH: /data/juan_state.db
      SOUL_MD_PATH: /config/SOUL.md
      AUTH_JSON_PATH: /config/juan_auth.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  juan-data:
    name: juan-data
